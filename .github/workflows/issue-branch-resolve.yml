name: Resolve Issue Branch

on:
  create

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: ${{ github.event.ref_type == 'branch' && github.actor == 'bkraad47' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Issue-Triage
    steps:
      - name: Guard — parse issue number
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          ISSUE_NUMBER=$(echo "$BRANCH_NAME" | grep -ioE 'issue[-_]?(no[-_]?)?[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Branch '$BRANCH_NAME' has no issue number — not an issue-linked branch, nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolving issue #$ISSUE_NUMBER on branch $BRANCH_NAME"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout issue branch
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Fetch issue content
        if: steps.guard.outputs.proceed == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view "${{ steps.guard.outputs.issue_number }}" \
            --json number,title,body,comments \
            > issue_raw.json
          echo "Fetched issue #${{ steps.guard.outputs.issue_number }}"

      - name: Set up Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: steps.guard.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install cupy-cuda13x
          pip install pydub
          pip install soundfile
          pip install mutagen
          pip install scipy
          pip install .

      - name: Install Claude Code CLI
        if: steps.guard.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        if: steps.guard.outputs.proceed == 'true'
        env:
          MCP_SERVER: ${{ secrets.MCP_SERVER }}
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
        run: |
          cat > /tmp/mcp-ci.json <<EOF
          {
            "mcpServers": {
              "fllm-mcp-server": {
                "type": "http",
                "url": "${MCP_SERVER}",
                "headers": {
                  "Authorization": "Bearer ${MCP_SECRET}"
                }
              }
            }
          }
          EOF

      - name: Triage issue content
        if: steps.guard.outputs.proceed == 'true'
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_SECRET }}
        run: |
          RAW_ISSUE=$(cat issue_raw.json)
          TRIAGE_RAW=$(claude -p "/triage-issue $RAW_ISSUE" \
            --allowedTools "" \
            --output-format json \
            < /dev/null)
          TRIAGE_RESULT=$(echo "$TRIAGE_RAW" | jq -r '.result')
          # Defensively strip a markdown code fence if the model wrapped its
          # JSON output in one despite being told not to.
          echo "$TRIAGE_RESULT" | sed -e '/^```/d' > triage_result.json

          CLEAN_STATEMENT=$(jq -r '.clean_problem_statement' triage_result.json)
          if [ -z "$CLEAN_STATEMENT" ] || [ "$CLEAN_STATEMENT" == "null" ]; then
            CLEAN_STATEMENT="Issue #${{ steps.guard.outputs.issue_number }}: no usable problem statement could be extracted."
          fi

          {
            echo "clean_statement<<TRIAGE_EOF"
            echo "$CLEAN_STATEMENT"
            echo "TRIAGE_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Triage notes: $(jq -r '.notes // empty' triage_result.json)"
          echo "Triage relevance: $(jq -r '.relevant // empty' triage_result.json)"

      - name: Run iterate-fat-llama
        if: steps.guard.outputs.proceed == 'true'
        id: iterate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_SECRET }}
          ITERATE_FAT_LLAMA_CI_MODE: "1"
          ITERATE_FAT_LLAMA_ISSUE_NUMBER: ${{ steps.guard.outputs.issue_number }}
          # Background Skill/Agent dispatches (review-current-state, test-fat-llama,
          # generate-code, ...) otherwise stop being waited on after Claude Code's default
          # ~10-minute ceiling and return control anyway -- a real risk here since
          # audio-quality-checker's local-fallback path alone is documented at ~20 minutes.
          # 0 disables the ceiling so a dispatch is always waited out to its real completion.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        run: |
          CLEAN_STATEMENT="${{ steps.triage.outputs.clean_statement }}"

          set +e
          ITERATE_RAW=$(claude -p "/iterate-fat-llama $CLEAN_STATEMENT" \
            --dangerously-skip-permissions \
            --permission-prompts none \
            --mcp-config /tmp/mcp-ci.json \
            --strict-mcp-config \
            --output-format json \
            < /dev/null)
          CLAUDE_EXIT=$?
          set -e

          ITERATE_RESULT=$(echo "$ITERATE_RAW" | jq -r '.result // empty')
          echo "$ITERATE_RESULT" > iterate_result.txt

          # A clean exit is not proof of success on its own -- a run that stalls or loses
          # track of a dispatch mid-flight can exit 0 having done none of its actual work
          # (confirmed via a real run: it narrated waiting on two dispatched skills, then
          # stopped without ever calling them). Only trust a genuine completion signal:
          # ITERATE_FAT_LLAMA_DONE_JSON: proves Step 7 was actually reached. Anything else --
          # an explicit failure block, a non-zero exit, or neither block at all -- is failed.
          if [ $CLAUDE_EXIT -eq 0 ] && echo "$ITERATE_RESULT" | grep -q "ITERATE_FAT_LLAMA_DONE_JSON:" && ! echo "$ITERATE_RESULT" | grep -q "ITERATE_FAT_LLAMA_FAILURE_JSON:"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit run logs
        if: always() && steps.guard.outputs.proceed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing left to commit -- iterate-fat-llama already committed everything (or the run produced no on-disk changes)."
          else
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "issue-branch-resolve: persist run logs/artifacts (workflow run ${{ github.run_id }})"
            git push origin "HEAD:refs/heads/$CURRENT_BRANCH"
            echo "Committed and pushed remaining run artifacts (including .claude/log/**) to $CURRENT_BRANCH."
          fi

      - name: Report failure
        if: steps.guard.outputs.proceed == 'true' && steps.iterate.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURE_JSON=$(grep -A 100 "ITERATE_FAT_LLAMA_FAILURE_JSON:" iterate_result.txt | tail -n +2 | sed -e '/^```/d' || true)
          if [ -z "$FAILURE_JSON" ]; then
            FAILURE_JSON='{"stage": "unknown", "error": "claude_cli_error", "error_description": "claude -p exited non-zero, or exited cleanly without ever emitting an ITERATE_FAT_LLAMA_DONE_JSON completion block (a stalled/incomplete run is not treated as success)", "details": "See workflow run logs for the raw output."}'
          fi

          STAGE=$(echo "$FAILURE_JSON" | jq -r '.stage // "unknown"')
          ERROR=$(echo "$FAILURE_JSON" | jq -r '.error // "unknown"')
          DESCRIPTION=$(echo "$FAILURE_JSON" | jq -r '.error_description // "no description"')
          DETAILS=$(echo "$FAILURE_JSON" | jq -r '.details // "no details"')

          echo "::error title=iterate-fat-llama failed at $STAGE::$ERROR — $DESCRIPTION"
          {
            echo "## iterate-fat-llama automated run failed"
            echo ""
            echo "- **Stage:** $STAGE"
            echo "- **Error:** $ERROR"
            echo "- **Description:** $DESCRIPTION"
            echo "- **Details:** $DETAILS"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "An automated attempt to resolve this issue failed."
            echo ""
            echo "- **Stage:** $STAGE"
            echo "- **Error:** $ERROR"
            echo "- **Description:** $DESCRIPTION"
            echo ""
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details."
          } > /tmp/failure_comment.md

          gh issue comment "${{ steps.guard.outputs.issue_number }}" --body-file /tmp/failure_comment.md
          exit 1
